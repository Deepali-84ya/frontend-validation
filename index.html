<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Frontend Validation</title><link rel='stylesheet' href='css/style.css'></head><body><div class='container'><h1>User Registration Form</h1><form id='registrationForm'><label>Full Name</label><input type='text' id='name'><span class='error' id='nameError'></span><label>Email</label><input type='text' id='email'><span class='error' id='emailError'></span><label>Phone Number</label><input type='text' id='phone'><span class='error' id='phoneError'></span><label>Password</label><input type='password' id='password'><span class='error' id='passwordError'></span><label>Confirm Password</label><input type='password' id='confirmPassword'><span class='error' id='confirmPasswordError'></span><button type='submit'>Register</button></form><p id='success'></p></div><script src='js/script.js'></script></body></html>
